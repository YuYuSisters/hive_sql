<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11st Ad Data Query Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .sql-font { font-family: 'Fira Code', monospace; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #ef4444; }

        /* Tree view animations */
        .tree-content { transition: max-height 0.3s ease-in-out; max-height: 2000px; overflow: hidden; }
        .tree-content.collapsed { max-height: 0; }
        .chevron { transition: transform 0.3s ease; }
        .chevron.collapsed { transform: rotate(-90deg); }
    </style>
</head>
<body class="h-screen flex flex-col bg-white overflow-hidden text-gray-800">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-red-600 text-white w-8 h-8 rounded-lg flex items-center justify-center shadow-md shadow-red-200">
                <i class="fas fa-database text-sm"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-gray-900 leading-tight">11st Ad Data Query Generator</h1>
                <p class="text-xs text-gray-500">Hive SQL Builder for Ad Data Mart</p>
            </div>
        </div>
        <div class="flex gap-3">
            <button onclick="resetWorkspace()" class="px-3 py-1.5 border border-gray-300 text-gray-600 rounded-md text-sm font-medium hover:bg-gray-50 transition">
                <i class="fas fa-redo-alt mr-1"></i> 초기화
            </button>
            <button onclick="copySQL()" class="bg-red-600 text-white px-4 py-1.5 rounded-md text-sm font-medium hover:bg-red-700 shadow-md shadow-red-200 transition flex items-center gap-2">
                <i class="fas fa-copy"></i> SQL 복사
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Left Sidebar: Table & Schema Tree -->
        <aside class="w-80 border-r border-gray-200 bg-gray-50 flex flex-col h-full shrink-0">
            <div class="p-4 border-b border-gray-200 bg-white shadow-sm z-10">
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-2.5 text-gray-400 text-sm"></i>
                    <input type="text" id="searchInput" placeholder="테이블 또는 필드 검색..." class="w-full text-sm border border-gray-300 rounded-md pl-9 pr-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all">
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto p-3" id="schemaTree">
                <!-- Tree items will be dynamically injected here -->
            </div>
        </aside>

        <!-- Right Main Workspace -->
        <div class="flex-1 flex flex-col min-w-0 bg-white">
            
            <!-- Top Half: Selected Columns & Joins -->
            <div class="h-1/2 border-b border-gray-200 flex p-4 gap-4 bg-gray-50/50 overflow-hidden shrink-0">
                
                <!-- Step 1: Selected Columns Panel -->
                <div class="flex-1 flex flex-col bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
                    <div class="bg-gray-50 px-4 py-2 border-b border-gray-200 flex justify-between items-center">
                        <h3 class="text-sm font-bold text-gray-700 flex items-center gap-2">
                            <div class="w-5 h-5 rounded bg-red-100 text-red-600 flex items-center justify-center text-xs">1</div>
                            출력 필드 (SELECT)
                        </h3>
                        <span id="colCount" class="text-xs font-medium bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full">0</span>
                    </div>
                    <div class="flex-1 p-3 overflow-y-auto" id="selectedColumnsList">
                        <!-- Selected Columns will be injected here -->
                        <div class="flex flex-col items-center justify-center h-full text-gray-400 space-y-2">
                            <i class="fas fa-list text-2xl mb-1"></i>
                            <p class="text-sm">좌측에서 출력할 필드를 선택해주세요.</p>
                        </div>
                    </div>
                </div>

                <!-- Step 2: Joins Panel -->
                <div class="flex-1 flex flex-col bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
                    <div class="bg-gray-50 px-4 py-2 border-b border-gray-200 flex justify-between items-center">
                        <h3 class="text-sm font-bold text-gray-700 flex items-center gap-2">
                            <div class="w-5 h-5 rounded bg-red-100 text-red-600 flex items-center justify-center text-xs">2</div>
                            조인 관계 (FROM & JOIN)
                        </h3>
                        <button onclick="addManualJoin()" class="text-xs text-red-600 hover:text-red-700 font-medium">
                            <i class="fas fa-plus"></i> 조인 추가
                        </button>
                    </div>
                    <div class="flex-1 p-3 overflow-y-auto space-y-2" id="joinList">
                        <!-- Joins will be injected here -->
                        <div class="flex flex-col items-center justify-center h-full text-gray-400 space-y-2 text-center px-4">
                            <i class="fas fa-link text-2xl mb-1"></i>
                            <p class="text-sm">2개 이상의 테이블을 선택하면<br>자동으로 조인 관계가 추천됩니다.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Half: Filters & SQL Preview -->
            <div class="h-1/2 flex p-4 gap-4 bg-gray-50/50">
                
                <!-- Step 3: Filters Panel -->
                <div class="w-1/3 flex flex-col bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
                    <div class="bg-gray-50 px-4 py-2 border-b border-gray-200 flex justify-between items-center">
                        <h3 class="text-sm font-bold text-gray-700 flex items-center gap-2">
                            <div class="w-5 h-5 rounded bg-red-100 text-red-600 flex items-center justify-center text-xs">3</div>
                            조회 조건 (WHERE)
                        </h3>
                        <button onclick="addFilter()" class="text-xs text-red-600 hover:text-red-700 font-medium">
                            <i class="fas fa-plus"></i> 조건 추가
                        </button>
                    </div>
                    <div class="flex-1 p-4 overflow-y-auto space-y-4">
                        
                        <!-- Partition Date Area -->
                        <div class="bg-red-50 border border-red-100 p-3 rounded-lg">
                            <div class="text-xs font-bold text-red-800 mb-2 flex items-center gap-1">
                                <i class="fas fa-calendar-alt"></i> 파티션 기간 (dt / part_date)
                            </div>
                            <div class="flex gap-2 items-center">
                                <input type="date" id="dateStart" class="border border-gray-300 rounded px-2 py-1.5 flex-1 text-xs focus:ring-1 focus:ring-red-500 focus:border-red-500">
                                <span class="text-gray-400 text-xs">~</span>
                                <input type="date" id="dateEnd" class="border border-gray-300 rounded px-2 py-1.5 flex-1 text-xs focus:ring-1 focus:ring-red-500 focus:border-red-500">
                            </div>
                        </div>

                        <hr class="border-gray-200">

                        <!-- Custom Filters List -->
                        <div id="filterList" class="space-y-2">
                            <!-- Filters will be injected here -->
                        </div>
                    </div>
                </div>

                <!-- Generated SQL Preview -->
                <div class="w-2/3 flex flex-col bg-gray-900 border border-gray-800 rounded-xl shadow-sm overflow-hidden relative group">
                    <div class="bg-gray-800 px-4 py-2 border-b border-gray-700 flex justify-between items-center">
                        <h3 class="text-sm font-bold text-gray-300 flex items-center gap-2">
                            <i class="fas fa-code text-red-500"></i> 생성된 Hive SQL
                        </h3>
                    </div>
                    
                    <div class="flex-1 p-4 overflow-auto relative">
                        <!-- Custom Modal for Alerts -->
                        <div id="toastMessage" class="absolute top-4 right-4 bg-green-500 text-white px-4 py-2 rounded shadow-lg text-sm font-medium transform transition-all duration-300 translate-x-full opacity-0 z-50">
                            복사되었습니다!
                        </div>
                        
                        <pre id="sqlPreview" class="sql-font text-sm text-green-400 whitespace-pre">
-- 테이블과 필드를 선택하면 SQL이 생성됩니다.
SELECT 
    * 
FROM dual;</pre>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // ==========================================
        // 1. DATA DICTIONARY & ERD DEFINITION
        // ==========================================
        
        // 주요 18개 테이블 및 핵심 컬럼 정의
        const tableSchema = {
            'CAMPAIGN': {
                db: 'ad_platform.dbm_dsp_camp',
                desc: '캠페인 정보 (일단위)',
                partition: 'dt',
                columns: [
                    { id: 'id', desc: '캠페인 ID', type: 'PK' },
                    { id: 'camp_nm', desc: '캠페인명', type: '' },
                    { id: 'actvtn_yn', desc: 'ON/OFF 상태', type: '' },
                    { id: 'ai_yn', desc: 'AI캠페인 여부', type: '' },
                    { id: 'ad_seller_id', desc: '셀러ID', type: 'FK' },
                    { id: 'dt', desc: '파티션 일자', type: 'PART' }
                ]
            },
            'AD_GROUP': {
                db: 'ad_platform.dbm_dsp_ad_grp',
                desc: '광고 그룹 정보 (일단위)',
                partition: 'part_date',
                columns: [
                    { id: 'id', desc: '그룹 ID', type: 'PK' },
                    { id: 'camp_id', desc: '캠페인 ID', type: 'FK' },
                    { id: 'ad_grp_nm', desc: '그룹명', type: '' },
                    { id: 'actvtn_yn', desc: 'ON/OFF 상태', type: '' },
                    { id: 'part_date', desc: '파티션 일자', type: 'PART' }
                ]
            },
            'AD_TARGET': {
                db: 'ad_platform.dbm_dsp_ad_trgt_live',
                desc: '광고 타겟 정보 (일단위)',
                partition: 'part_date',
                columns: [
                    { id: 'id', desc: '타겟 ID', type: 'PK' },
                    { id: 'ad_grp_id', desc: '그룹 ID', type: 'FK' },
                    { id: 'prod_no', desc: '광고 상품 번호', type: 'FK' },
                    { id: 'actvtn_yn', desc: 'ON/OFF 상태', type: '' },
                    { id: 'part_date', desc: '파티션 일자', type: 'PART' }
                ]
            },
            'AD_IMPRESSION': {
                db: 'ad_platform.vine_app_new_ad_logserver_live_parse_v5',
                desc: '포커스클릭 노출/클릭 (일단위)',
                partition: 'part_hour',
                columns: [
                    { id: 'impression_id', desc: '노출 ID', type: 'PK' },
                    { id: 'act_id', desc: '액션 ID (클릭시)', type: '' },
                    { id: 'campaign_id', desc: '캠페인 ID', type: 'FK' },
                    { id: 'ad_group_id', desc: '그룹 ID', type: 'FK' },
                    { id: 'affiliation_product_key', desc: '상품번호', type: 'FK' },
                    { id: 'transaction_type', desc: '액션유형(imp/click)', type: '' },
                    { id: 'impression', desc: '노출수', type: 'METRIC' },
                    { id: 'click', desc: '클릭수', type: 'METRIC' },
                    { id: 'part_hour', desc: '파티션 일자 (yyyymmdd)', type: 'PART' }
                ]
            },
            'AD_FEE': {
                db: 'ad_platform.dsp_ad_fee_log_live_parse_v5',
                desc: '포커스클릭 과금 (일단위)',
                partition: 'part_hour',
                columns: [
                    { id: 'act_id', desc: '클릭 ID', type: 'FK' },
                    { id: 'impression_id', desc: '노출 ID', type: 'FK' },
                    { id: 'pay_result', desc: '과금 유형(101=정상)', type: '' },
                    { id: 'cash_amount', desc: '캐시 결제 금액', type: 'METRIC' },
                    { id: 'non_free_point_amount', desc: '유상포인트 결제', type: 'METRIC' },
                    { id: 'part_hour', desc: '파티션 일자', type: 'PART' }
                ]
            },
            'AD_CONVERSION': {
                db: 'ad_platform.vine_new_ad_log_cvr_live_v5',
                desc: '포커스클릭 전환 (일단위)',
                partition: 'part_hour',
                columns: [
                    { id: 'act_id', desc: '클릭 ID', type: 'FK' },
                    { id: 'conversion', desc: '직접 전환수', type: 'METRIC' },
                    { id: 'conversion_price', desc: '직접 전환금액', type: 'METRIC' },
                    { id: 'part_hour', desc: '파티션 일자', type: 'PART' }
                ]
            },
            'PRODUCT': {
                db: '11st.tb_evs_ods_m_dp_live_prd',
                desc: '전시 상품 정보 (일단위)',
                partition: 'part_date',
                columns: [
                    { id: 'prd_no', desc: '상품번호', type: 'PK' },
                    { id: 'sel_mnbd_no', desc: '셀러번호', type: '' },
                    { id: 'prd_nm', desc: '상품명', type: '' },
                    { id: 'sel_stat_cd', desc: '판매상태코드(103=판매중)', type: '' },
                    { id: 'sel_prc', desc: '판매가', type: 'METRIC' },
                    { id: 'part_date', desc: '파티션 일자', type: 'PART' }
                ]
            },
            'SEARCH_LOG': {
                db: 'search.sch_11st_log_client_base',
                desc: '검색로그 (일단위)',
                partition: 'dt',
                columns: [
                    { id: 'session_id', desc: '세션단위 구분 ID', type: 'PK' },
                    { id: 'keyword', desc: '검색어', type: '' },
                    { id: 'keyword_grp_id', desc: '키워드 그룹 ID', type: '' },
                    { id: 'page_type', desc: '페이지타입(검색/상세 등)', type: '' },
                    { id: 'product_no', desc: '상품번호 (약결합)', type: 'FK' },
                    { id: 'dt', desc: '파티션 일자', type: 'PART' }
                ]
            },
            'BID_STATUS': {
                db: 'share_ad.focus_bid_trgt_total',
                desc: '입찰 상태 (일단위)',
                partition: 'dt',
                columns: [
                    { id: 'ad_camp_id', desc: '캠페인ID', type: 'FK' },
                    { id: 'ad_grp_id', desc: '그룹ID', type: 'FK' },
                    { id: 'prd_no', desc: '상품번호', type: 'FK' },
                    { id: 'actvtn_yn', desc: '활성여부', type: '' },
                    { id: 'dt', desc: '파티션 일자', type: 'PART' }
                ]
            },
            'PAYMENT': {
                db: 'share_ad.trans_ad_rel_base',
                desc: '결제 정보 (일단위)',
                partition: 'dt',
                columns: [
                    { id: 'prd_no', desc: '상품번호', type: 'FK' },
                    { id: 'pay_trns_amt', desc: '결제거래액', type: 'METRIC' },
                    { id: 'pay_net_sale_amt', desc: '결제순매출액', type: 'METRIC' },
                    { id: 'dt', desc: '파티션 일자', type: 'PART' }
                ]
            }
        };

        // ERD Relationship Rules (Known Auto-Joins)
        const erdRules = [
            { t1: 'CAMPAIGN', t2: 'AD_GROUP', c1: 'id', c2: 'camp_id' },
            { t1: 'AD_GROUP', t2: 'AD_TARGET', c1: 'id', c2: 'ad_grp_id' },
            { t1: 'AD_TARGET', t2: 'PRODUCT', c1: 'prod_no', c2: 'prd_no' },
            { t1: 'CAMPAIGN', t2: 'AD_IMPRESSION', c1: 'id', c2: 'campaign_id' },
            { t1: 'AD_GROUP', t2: 'AD_IMPRESSION', c1: 'id', c2: 'ad_group_id' },
            { t1: 'PRODUCT', t2: 'AD_IMPRESSION', c1: 'prd_no', c2: 'affiliation_product_key' },
            { t1: 'AD_IMPRESSION', t2: 'AD_FEE', c1: 'impression_id', c2: 'impression_id', secondary: {c1:'act_id', c2:'act_id'} },
            { t1: 'AD_FEE', t2: 'AD_CONVERSION', c1: 'act_id', c2: 'act_id' },
            { t1: 'CAMPAIGN', t2: 'BID_STATUS', c1: 'id', c2: 'ad_camp_id' },
            { t1: 'PRODUCT', t2: 'BID_STATUS', c1: 'prd_no', c2: 'prd_no' },
            { t1: 'PRODUCT', t2: 'PAYMENT', c1: 'prd_no', c2: 'prd_no' },
            { t1: 'PRODUCT', t2: 'SEARCH_LOG', c1: 'prd_no', c2: 'product_no' }
        ];

        // ==========================================
        // 2. STATE MANAGEMENT
        // ==========================================
        let state = {
            selectedColumns: [], // Array of { table: 'CAMPAIGN', col: 'id' }
            selectedTables: new Set(),
            tableAliases: {}, // { 'CAMPAIGN': 'A', 'AD_GROUP': 'B' }
            joins: [], // Array of { t1, t2, c1, c2, type: 'LEFT JOIN' }
            filters: [], // Array of { table, col, op, val }
            dateRange: { start: '', end: '' }
        };

        const aliasList = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];

        // ==========================================
        // 3. UI RENDERING
        // ==========================================
        
        // Render Sidebar Tree
        function renderSidebar() {
            const container = document.getElementById('schemaTree');
            container.innerHTML = '';
            
            Object.keys(tableSchema).forEach(tableName => {
                const table = tableSchema[tableName];
                
                // Group Container
                const group = document.createElement('div');
                group.className = 'mb-2 border border-gray-100 rounded-md overflow-hidden bg-white shadow-sm';
                
                // Header (Table Name)
                const header = document.createElement('div');
                header.className = 'flex justify-between items-center p-2 cursor-pointer bg-gray-50 hover:bg-red-50 transition select-none group';
                header.onclick = () => toggleTree(tableName);
                
                header.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden">
                        <i class="fas fa-table text-red-500 text-xs shrink-0"></i>
                        <div class="truncate">
                            <div class="text-sm font-bold text-gray-800 group-hover:text-red-700">${tableName}</div>
                            <div class="text-[10px] text-gray-400">${table.db.split('.')[1] || table.db}</div>
                        </div>
                    </div>
                    <i class="fas fa-chevron-down text-[10px] text-gray-400 chevron collapsed" id="chevron-${tableName}"></i>
                `;
                
                // Content (Columns)
                const content = document.createElement('div');
                content.className = 'tree-content collapsed bg-white';
                content.id = `tree-${tableName}`;
                
                let colsHtml = '';
                table.columns.forEach(col => {
                    const isSelected = state.selectedColumns.some(c => c.table === tableName && c.col === col.id);
                    
                    let icon = '<i class="fas fa-columns text-gray-300"></i>';
                    let badge = '';
                    if(col.type === 'PK') { icon = '<i class="fas fa-key text-yellow-500"></i>'; badge = '<span class="text-[9px] bg-yellow-100 text-yellow-700 px-1 rounded">PK</span>'; }
                    if(col.type === 'FK') { icon = '<i class="fas fa-link text-blue-400"></i>'; badge = '<span class="text-[9px] bg-blue-100 text-blue-700 px-1 rounded">FK</span>'; }
                    if(col.type === 'PART') { icon = '<i class="fas fa-clock text-green-500"></i>'; badge = '<span class="text-[9px] bg-green-100 text-green-700 px-1 rounded">PART</span>'; }
                    if(col.type === 'METRIC') { icon = '<i class="fas fa-hashtag text-purple-500"></i>'; badge = '<span class="text-[9px] bg-purple-100 text-purple-700 px-1 rounded">NUM</span>'; }

                    colsHtml += `
                        <div onclick="toggleColumn('${tableName}', '${col.id}')" 
                             class="flex justify-between items-center p-1.5 pl-6 cursor-pointer text-xs border-t border-gray-50 transition-colors
                                    ${isSelected ? 'bg-red-50 text-red-700 font-medium' : 'text-gray-600 hover:bg-gray-100'}">
                            <div class="flex items-center gap-2">
                                ${icon}
                                <span>${col.id}</span>
                            </div>
                            <div class="flex items-center gap-1">
                                ${badge}
                                ${isSelected ? '<i class="fas fa-check text-red-500 ml-1"></i>' : ''}
                            </div>
                        </div>
                    `;
                });
                
                content.innerHTML = colsHtml;
                group.appendChild(header);
                group.appendChild(content);
                container.appendChild(group);
            });
        }

        // Toggle Tree Expand/Collapse
        function toggleTree(tableName) {
            const content = document.getElementById(`tree-${tableName}`);
            const chevron = document.getElementById(`chevron-${tableName}`);
            content.classList.toggle('collapsed');
            chevron.classList.toggle('collapsed');
        }

        // Update Selected Columns Panel
        function renderSelectedColumns() {
            const container = document.getElementById('selectedColumnsList');
            document.getElementById('colCount').innerText = state.selectedColumns.length;
            
            if (state.selectedColumns.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-gray-400 space-y-2">
                        <i class="fas fa-list text-2xl mb-1"></i>
                        <p class="text-sm">좌측에서 출력할 필드를 선택해주세요.</p>
                    </div>`;
                return;
            }

            let html = '<div class="space-y-1.5">';
            state.selectedColumns.forEach(item => {
                const alias = state.tableAliases[item.table];
                html += `
                    <div class="bg-white p-2 text-xs border border-gray-200 rounded-md shadow-sm flex justify-between items-center group hover:border-red-300">
                        <div class="flex items-center gap-2">
                            <span class="bg-gray-100 text-gray-500 font-mono px-1.5 py-0.5 rounded text-[10px]">${alias}</span>
                            <span class="font-bold text-red-600">${item.table}</span> 
                            <span class="text-gray-400">.</span> 
                            <span class="font-medium text-gray-800">${item.col}</span>
                        </div>
                        <i onclick="toggleColumn('${item.table}', '${item.col}')" class="fas fa-times text-gray-300 hover:text-red-500 cursor-pointer hidden group-hover:block transition"></i>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        // Update Joins Panel
        function renderJoins() {
            const container = document.getElementById('joinList');
            
            if (state.joins.length === 0) {
                if (state.selectedTables.size < 2) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full text-gray-400 space-y-2 text-center px-4">
                            <i class="fas fa-link text-2xl mb-1"></i>
                            <p class="text-sm">2개 이상의 테이블을 선택하면<br>자동으로 조인 관계가 추천됩니다.</p>
                        </div>`;
                } else {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full text-gray-400 space-y-2 text-center px-4">
                            <i class="fas fa-exclamation-triangle text-xl mb-1 text-yellow-500"></i>
                            <p class="text-sm">선택된 테이블간 추천 조인이 없습니다.<br>수동으로 추가해주세요.</p>
                        </div>`;
                }
                return;
            }

            let html = '<div class="space-y-3">';
            state.joins.forEach((j, index) => {
                const a1 = state.tableAliases[j.t1];
                const a2 = state.tableAliases[j.t2];
                
                html += `
                    <div class="bg-white border border-gray-200 rounded-md p-3 shadow-sm text-xs relative group">
                        <div class="flex items-center gap-2 mb-2">
                            <select onchange="updateJoinType(${index}, this.value)" class="border border-gray-300 rounded p-1 font-bold text-red-600 bg-red-50 outline-none">
                                <option value="LEFT JOIN" ${j.type === 'LEFT JOIN' ? 'selected' : ''}>LEFT JOIN</option>
                                <option value="INNER JOIN" ${j.type === 'INNER JOIN' ? 'selected' : ''}>INNER JOIN</option>
                            </select>
                            <span class="font-bold text-gray-700">${j.t2}</span> <span class="text-gray-400 font-mono">(${a2})</span>
                        </div>
                        <div class="flex items-center flex-wrap gap-1.5 pl-2 border-l-2 border-gray-200">
                            <span class="text-gray-500 font-bold">ON</span>
                            <span class="bg-gray-100 border border-gray-200 px-1.5 py-0.5 rounded font-mono">${a1}.${j.c1}</span>
                            <span class="text-gray-500 font-bold">=</span>
                            <span class="bg-gray-100 border border-gray-200 px-1.5 py-0.5 rounded font-mono">${a2}.${j.c2}</span>
                        </div>
                        <i onclick="removeJoin(${index})" class="fas fa-trash-alt absolute top-3 right-3 text-gray-300 hover:text-red-500 cursor-pointer hidden group-hover:block transition"></i>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        // Render Custom Filters
        function renderFilters() {
            const container = document.getElementById('filterList');
            let html = '';
            
            const tableArr = Array.from(state.selectedTables);
            
            state.filters.forEach((f, index) => {
                
                // Build table options
                let tableOpts = tableArr.map(t => `<option value="${t}" ${f.table === t ? 'selected' : ''}>${t}</option>`).join('');
                if(tableOpts === '') tableOpts = '<option value="">테이블 선택</option>';

                html += `
                    <div class="flex items-center gap-2 text-xs bg-white p-2 border border-gray-200 rounded shadow-sm">
                        <select onchange="updateFilter(${index}, 'table', this.value)" class="border rounded p-1 max-w-[100px] truncate outline-none focus:border-red-500">
                            ${tableOpts}
                        </select>
                        <input type="text" placeholder="컬럼명 (예: actvtn_yn)" value="${f.col}" onchange="updateFilter(${index}, 'col', this.value)" class="border rounded p-1 w-24 outline-none focus:border-red-500">
                        <select onchange="updateFilter(${index}, 'op', this.value)" class="border rounded p-1 font-bold text-red-600 bg-red-50 outline-none">
                            <option value="=" ${f.op === '=' ? 'selected' : ''}>=</option>
                            <option value="!=" ${f.op === '!=' ? 'selected' : ''}>!=</option>
                            <option value=">" ${f.op === '>' ? 'selected' : ''}>&gt;</option>
                            <option value="<" ${f.op === '<' ? 'selected' : ''}>&lt;</option>
                            <option value="IN" ${f.op === 'IN' ? 'selected' : ''}>IN</option>
                            <option value="LIKE" ${f.op === 'LIKE' ? 'selected' : ''}>LIKE</option>
                        </select>
                        <input type="text" placeholder="값 (예: 'Y')" value="${f.val}" onchange="updateFilter(${index}, 'val', this.value)" class="border rounded p-1 flex-1 outline-none focus:border-red-500 font-mono">
                        <i onclick="removeFilter(${index})" class="fas fa-times text-gray-400 hover:text-red-500 cursor-pointer ml-1"></i>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // ==========================================
        // 4. INTERACTIVE LOGIC
        // ==========================================

        function toggleColumn(tableName, colId) {
            const existingIdx = state.selectedColumns.findIndex(c => c.table === tableName && c.col === colId);
            
            if (existingIdx >= 0) {
                // Remove
                state.selectedColumns.splice(existingIdx, 1);
            } else {
                // Add
                state.selectedColumns.push({ table: tableName, col: colId });
            }

            updateTableDependencies();
            renderSidebar(); // Update checkmarks
            renderSelectedColumns();
            renderJoins();
            renderFilters();
            generateSQL();
        }

        function updateTableDependencies() {
            const activeTables = new Set(state.selectedColumns.map(c => c.table));
            
            // Assign aliases to new tables
            activeTables.forEach(t => {
                if (!state.selectedTables.has(t)) {
                    const nextAliasIndex = state.selectedTables.size;
                    state.tableAliases[t] = aliasList[nextAliasIndex] || `T${nextAliasIndex}`;
                }
            });

            // Cleanup removed tables aliases
            Object.keys(state.tableAliases).forEach(t => {
                if (!activeTables.has(t)) delete state.tableAliases[t];
            });

            state.selectedTables = activeTables;
            autoCalculateJoins();
        }

        function autoCalculateJoins() {
            // Very simple auto-joiner: Find relationships in ERD where both tables are selected
            const tableArr = Array.from(state.selectedTables);
            state.joins = [];

            if (tableArr.length < 2) return;

            // Simple assumption: First selected table is the driving table (FROM)
            const drivingTable = tableArr[0];
            
            for (let i = 1; i < tableArr.length; i++) {
                const targetTable = tableArr[i];
                let foundJoin = false;
                
                // Look for rule connecting drivingTable (or any previously joined table) to targetTable
                for (let j = 0; j < i; j++) {
                    const sourceTable = tableArr[j];
                    
                    const rule = erdRules.find(r => 
                        (r.t1 === sourceTable && r.t2 === targetTable) || 
                        (r.t1 === targetTable && r.t2 === sourceTable)
                    );

                    if (rule) {
                        const isReversed = rule.t1 === targetTable;
                        state.joins.push({
                            t1: isReversed ? rule.t2 : rule.t1,
                            t2: isReversed ? rule.t1 : rule.t2,
                            c1: isReversed ? rule.c2 : rule.c1,
                            c2: isReversed ? rule.c1 : rule.c2,
                            type: 'LEFT JOIN'
                        });
                        foundJoin = true;
                        break;
                    }
                }
                
                // If no direct ERD rule, add a placeholder
                if(!foundJoin) {
                    state.joins.push({
                        t1: drivingTable, t2: targetTable, c1: '???', c2: '???', type: 'LEFT JOIN'
                    });
                }
            }
        }

        function addManualJoin() {
            if(state.selectedTables.size < 2) {
                alert("테이블을 2개 이상 먼저 선택해주세요.");
                return;
            }
            const tableArr = Array.from(state.selectedTables);
            state.joins.push({
                t1: tableArr[0], t2: tableArr[tableArr.length-1], c1: 'id', c2: 'id', type: 'LEFT JOIN'
            });
            renderJoins();
            generateSQL();
        }

        function removeJoin(index) {
            state.joins.splice(index, 1);
            renderJoins();
            generateSQL();
        }
        
        function updateJoinType(index, val) {
            state.joins[index].type = val;
            generateSQL();
        }

        function addFilter() {
            const tableArr = Array.from(state.selectedTables);
            const defaultTable = tableArr.length > 0 ? tableArr[0] : '';
            state.filters.push({ table: defaultTable, col: '', op: '=', val: "''" });
            renderFilters();
            generateSQL();
        }

        function updateFilter(index, field, val) {
            state.filters[index][field] = val;
            generateSQL();
        }

        function removeFilter(index) {
            state.filters.splice(index, 1);
            renderFilters();
            generateSQL();
        }

        // Listen for Date changes
        document.getElementById('dateStart').addEventListener('change', (e) => { state.dateRange.start = e.target.value; generateSQL(); });
        document.getElementById('dateEnd').addEventListener('change', (e) => { state.dateRange.end = e.target.value; generateSQL(); });


        // ==========================================
        // 5. HIVE SQL GENERATOR
        // ==========================================
        function generateSQL() {
            const tableArr = Array.from(state.selectedTables);
            if (tableArr.length === 0) {
                document.getElementById('sqlPreview').innerText = '-- 테이블과 필드를 선택하면 SQL이 생성됩니다.\nSELECT \n    * \nFROM dual;';
                return;
            }

            let sql = 'SELECT\n';
            
            // SELECT
            if (state.selectedColumns.length === 0) {
                sql += `    ${state.tableAliases[tableArr[0]]}.*\n`;
            } else {
                const sel = state.selectedColumns.map(c => `    ${state.tableAliases[c.table]}.${c.col}`).join(',\n');
                sql += sel + '\n';
            }

            // FROM
            const drivingTable = tableArr[0];
            const drivingSchema = tableSchema[drivingTable];
            sql += `FROM ${drivingSchema.db} ${state.tableAliases[drivingTable]}\n`;

            // JOIN
            state.joins.forEach(j => {
                const schemaT2 = tableSchema[j.t2];
                // Safety check if table was removed
                if(!schemaT2) return; 
                sql += `${j.type} ${schemaT2.db} ${state.tableAliases[j.t2]}\n`;
                sql += `    ON ${state.tableAliases[j.t1]}.${j.c1} = ${state.tableAliases[j.t2]}.${j.c2}\n`;
            });

            // WHERE
            let wheres = [];
            
            // Global Partition Date
            const dtStart = state.dateRange.start ? state.dateRange.start.replace(/-/g, '') : null;
            const dtEnd = state.dateRange.end ? state.dateRange.end.replace(/-/g, '') : null;
            
            if (dtStart || dtEnd) {
                // Apply partition to driving table
                const partCol = drivingSchema.partition;
                const alias = state.tableAliases[drivingTable];
                if (dtStart && dtEnd && dtStart === dtEnd) {
                    wheres.push(`${alias}.${partCol} = '${dtStart}'`);
                } else if (dtStart && dtEnd) {
                    wheres.push(`${alias}.${partCol} BETWEEN '${dtStart}' AND '${dtEnd}'`);
                } else if (dtStart) {
                    wheres.push(`${alias}.${partCol} >= '${dtStart}'`);
                } else if (dtEnd) {
                    wheres.push(`${alias}.${partCol} <= '${dtEnd}'`);
                }
            }

            // Custom Filters
            state.filters.forEach(f => {
                if (f.col && f.val) {
                    const alias = state.tableAliases[f.table] || f.table;
                    wheres.push(`${alias}.${f.col} ${f.op} ${f.val}`);
                }
            });

            if (wheres.length > 0) {
                sql += `WHERE ${wheres[0]}\n`;
                for (let i = 1; i < wheres.length; i++) {
                    sql += `  AND ${wheres[i]}\n`;
                }
            }

            sql += ';';
            document.getElementById('sqlPreview').innerText = sql;
        }

        function resetWorkspace() {
            state = {
                selectedColumns: [],
                selectedTables: new Set(),
                tableAliases: {},
                joins: [],
                filters: [],
                dateRange: { start: '', end: '' }
            };
            document.getElementById('dateStart').value = '';
            document.getElementById('dateEnd').value = '';
            
            renderSidebar();
            renderSelectedColumns();
            renderJoins();
            renderFilters();
            generateSQL();
        }

        function copySQL() {
            const sql = document.getElementById('sqlPreview').innerText;
            navigator.clipboard.writeText(sql).then(() => {
                const toast = document.getElementById('toastMessage');
                toast.classList.remove('translate-x-full', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('translate-x-full', 'opacity-0');
                }, 2000);
            }).catch(err => {
                // Fallback for iframe / older browsers
                const textArea = document.createElement("textarea");
                textArea.value = sql;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
                
                const toast = document.getElementById('toastMessage');
                toast.classList.remove('translate-x-full', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('translate-x-full', 'opacity-0');
                }, 2000);
            });
        }

        // Search functionality in sidebar
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const groups = document.querySelectorAll('#schemaTree > div');
            
            groups.forEach(group => {
                const tableName = group.querySelector('.font-bold').innerText.toLowerCase();
                const columns = Array.from(group.querySelectorAll('.tree-content > div')).map(el => el.innerText.toLowerCase());
                
                const matchTable = tableName.includes(term);
                const matchCol = columns.some(col => col.includes(term));
                
                if (matchTable || matchCol) {
                    group.style.display = 'block';
                    // Auto expand if matching column inside
                    const content = group.querySelector('.tree-content');
                    const chevron = group.querySelector('.chevron');
                    if (matchCol && term !== '' && content.classList.contains('collapsed')) {
                        content.classList.remove('collapsed');
                        chevron.classList.remove('collapsed');
                    }
                } else {
                    group.style.display = 'none';
                }
            });
        });

        // Initialize App
        window.onload = function() {
            renderSidebar();
        };

    </script>
</body>
</html>
